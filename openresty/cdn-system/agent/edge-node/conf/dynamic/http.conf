upstream upstream_26 {
    server 172.20.0.1:8080 weight=10;
}
server {
    listen 81;
    server_name ws-test.local;
    client_max_body_size 32m;
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json;
    limit_rate 1310720;
    limit_conn addr_conn 1000;
    limit_conn_status 429;
    error_page 504 /__cdn_error/504.html;
    location = /__cdn_error/504.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/504.html;
    }
    error_page 418 /__cdn_error/ip.html;
    location = /__cdn_error/ip.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/ip.html;
    }
    error_page 451 /__cdn_error/site_locked.html;
    location = /__cdn_error/site_locked.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/site_locked.html;
    }
    error_page 502 /__cdn_error/502.html;
    location = /__cdn_error/502.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/502.html;
    }
    error_page 404 /__cdn_error/domain_invalid.html;
    location = /__cdn_error/domain_invalid.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/domain_invalid.html;
    }
    error_page 509 /__cdn_error/traffic_limit.html;
    location = /__cdn_error/traffic_limit.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/traffic_limit.html;
    }
    error_page 429 /__cdn_error/conn_limit.html;
    location = /__cdn_error/conn_limit.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/conn_limit.html;
    }
    error_page 410 /__cdn_error/timeout.html;
    location = /__cdn_error/timeout.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/timeout.html;
    }
    error_page 403 /__cdn_error/403.html;
    location = /__cdn_error/403.html {
        internal;
        default_type text/html;
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/error_pages/403.html;
    }
    set $cc_rule_id 10028;
    location = /_guard/captcha.png {
        default_type image/png;
        content_by_lua_block {
            local guard = require "lua.guard"
            guard.serve_captcha_png()
        }
    }
    location = /_guard/rotate_image {
        default_type image/jpeg;
        content_by_lua_block {
            local guard = require "lua.guard"
            guard.serve_rotate_image()
        }
    }
    location ^~ /_guard/ {
        alias E:/cdn/goedge/openresty/cdn-system/agent/edge-node/conf/guard/;
    }
    location ^~ /.well-known/acme-challenge/ {
        root edge-node/cert/acme;
        default_type text/plain;
        try_files $uri @acme_master;
    }
    location @acme_master {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        limit_req zone=cc_limit burst=20 nodelay;
        limit_conn addr_conn 50;
        access_by_lua_file lua/access_guard.lua;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_pass https://upstream_26;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_cache my_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_key $host$uri$is_args$args;
    }
}
