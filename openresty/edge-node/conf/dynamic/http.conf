upstream upstream_26 {
    server 172.20.0.1:8080 weight=10;
}
server {
    listen 80;
    server_name ws-test.local;
    client_max_body_size 32m;
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json;
    limit_rate 1703936;
    limit_conn addr_conn 13;
    set $cc_rule_id 10028;
    location ^~ /.well-known/acme-challenge/ {
        root edge-node/cert/acme;
        default_type text/plain;
        try_files $uri @acme_master;
    }
    location @acme_master {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        limit_req zone=cc_limit burst=20 nodelay;
        limit_conn addr_conn 50;
        access_by_lua_file lua/access_guard.lua;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_pass http://upstream_26;
        proxy_cache my_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_key $host$uri$is_args$args;
    }
}
server {
    listen 443 ssl;
    ssl_certificate cert/fallback.pem;
    ssl_certificate_key cert/fallback.key;
    ssl_certificate_by_lua_block {
        local ssl_mgr = require "lua.ssl_manager"
        ssl_mgr.set_certificate()
    }
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3 TLSv1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA;
    ssl_prefer_server_ciphers on;
    server_name ws-test.local;
    client_max_body_size 32m;
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json;
    limit_rate 1703936;
    limit_conn addr_conn 13;
    set $cc_rule_id 10028;
    location ^~ /.well-known/acme-challenge/ {
        root edge-node/cert/acme;
        default_type text/plain;
        try_files $uri @acme_master;
    }
    location @acme_master {
        proxy_pass http://172.20.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        limit_req zone=cc_limit burst=20 nodelay;
        limit_conn addr_conn 50;
        access_by_lua_file lua/access_guard.lua;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_pass http://upstream_26;
        proxy_cache my_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_key $host$uri$is_args$args;
    }
}
server {
    listen 80 default_server;
    server_name _;
    location / {
        return 404;
    }
}
