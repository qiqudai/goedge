name: stream-e2e

services:
  origin:
    image: python:3.12-alpine
    command: ["python", "/app/server.py"]
    volumes:
      - ./origin/server.py:/app/server.py:ro
    networks:
      - streamnet

  edge:
    image: openresty/openresty:1.25.3.1-0-alpine-fat
    depends_on:
      - origin
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./stream.conf:/usr/local/openresty/nginx/conf/stream.conf:ro
    ports:
      - "19001:19001/tcp"
      - "19002:19002/udp"
    networks:
      - streamnet

  test:
    image: python:3.12-alpine
    depends_on:
      - edge
    command: ["python", "/scripts/run_test.py"]
    volumes:
      - ./scripts/run_test.py:/scripts/run_test.py:ro
    networks:
      - streamnet

networks:
  streamnet:
    driver: bridge
