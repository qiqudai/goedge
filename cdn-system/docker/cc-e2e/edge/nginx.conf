worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log /dev/stdout;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    lua_package_path "/opt/cc/?.lua;/opt/cc/?/init.lua;/opt/cc/lua/?.lua;/opt/cc/lua/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_package_cpath "/opt/cc/lua/?.so;/usr/local/openresty/lualib/?.so;;";

    lua_shared_dict cc_req_rate 10m;
    lua_shared_dict guard_store 10m;
    lua_shared_dict waf_cache 10m;
    lua_shared_dict ip_blacklist 10m;
    lua_shared_dict metrics_store 10m;
    lua_shared_dict config_store 10m;

    init_worker_by_lua_block {
        local config_loader = require "lua.config_loader"
        config_loader.init()
    }

    server {
        listen 18088;
        server_name cc-test.local;

        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $backend_target "";
            set $cache_bypass 0;
            set $cache_ttl 0;
            set $cdn_req_headers "";
            set $cdn_resp_headers "";
            set $cdn_req_body "";
            set $client_country "";
            set $client_province "";
            set $client_city "";
            set $client_isp "";
            set $cdn_realtime_send 0;
            set $cdn_cache_key "";
            set $origin_http_policy "";
            set $origin_auto_downgrade 1;
            set $origin_downgrade_threshold 3;
            set $origin_downgrade_window 60;
            set $origin_downgrade_cooldown 600;
            set $origin_compat 0;
            set $origin_connection "";

            access_by_lua_file /opt/cc/lua/access_guard.lua;

            proxy_pass $backend_target;
            proxy_set_header Host $host;
        }
    }
}
