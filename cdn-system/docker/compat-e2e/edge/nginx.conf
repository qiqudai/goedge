worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log /dev/stdout;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    lua_package_path "/opt/compat/?.lua;/opt/compat/lua/?.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_shared_dict config_store 1m;

    init_by_lua_block {
        _G.cdn_config = {
            node_id = "compat",
            node_level = 1,
            domains = {},
            domain_map = {},
        }
    }

    map $http_upgrade $cdn_websocket_upgrade {
        default "";
        ~*^websocket$ $http_upgrade;
    }

    map $http_upgrade $connection_upgrade {
        default "";
        ~*^websocket$ upgrade;
    }

    server {
        listen 18443 ssl;
        http2 on;
        server_name compat.test;

        ssl_certificate /opt/compat/cert/test.crt;
        ssl_certificate_key /opt/compat/cert/test.key;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $cdn_req_headers "";
            set $cdn_resp_headers "";
            set $cdn_req_body "";
            set $client_country "";
            set $client_province "";
            set $client_city "";
            set $client_isp "";
            set $cdn_realtime_send 0;
            set $cdn_cache_key "";
            set $backend_target "http://origin:8080";

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $cdn_websocket_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Expect "";
            proxy_set_header Keep-Alive "";
            proxy_set_header Proxy-Connection "";
            proxy_set_header TE "";
            proxy_set_header Trailer "";
            header_filter_by_lua_file lua/response_headers.lua;
            proxy_pass http://origin:8080;
        }
    }
}
