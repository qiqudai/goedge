include dynamic/main.conf;

events {
    use epoll;
    multi_accept on;
    include dynamic/events.conf;
}

http {
    include       mime.types;

    lua_package_path "$prefix/?.lua;$prefix/?/init.lua;$prefix/lua/?.lua;$prefix/lua/?/init.lua;$prefix/openresty/lualib/?.lua;$prefix/openresty/lualib/?/init.lua;;";
    lua_package_cpath "$prefix/lua/?.so;$prefix/openresty/lualib/?.so;;";

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    
    # --------------------------------------------------------
    # 1. Performance Tuning (Kernel/Network)
    # --------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    
    # --------------------------------------------------------
    # 2. JSON Logging (User Req #2) - Machine Parsable
    # --------------------------------------------------------
    # Declare custom log variables to avoid "unknown variable" errors
    map "" $cdn_req_headers { default ""; }
    map "" $cdn_resp_headers { default ""; }
    map "" $cdn_req_body { default ""; }
    map "" $cdn_realtime_send { default 1; }

    log_format json_analytics escape=json
    '{'
      '"time_iso8601": "$time_iso8601",'
      '"remote_addr": "$remote_addr",'
      '"host": "$host",'
      '"request": "$request",'
      '"status": $status,'
      '"body_bytes_sent": $body_bytes_sent,'
      '"request_time": $request_time,'
      '"upstream_addr": "$upstream_addr",'
      '"upstream_response_time": "$upstream_response_time",'
      '"upstream_cache_status": "$upstream_cache_status",'
      '"http_referer": "$http_referer",'
      '"http_user_agent": "$http_user_agent",'
      '"cdn_req_headers": "$cdn_req_headers",'
      '"cdn_resp_headers": "$cdn_resp_headers",'
      '"cdn_req_body": "$cdn_req_body",'
      '"scheme": "$scheme",'
      '"ssl_protocol": "$ssl_protocol",'
      '"ssl_cipher": "$ssl_cipher"'
    '}';

    error_log  logs/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --------------------------------------------------------
    # 3. Native Security Layers (User Req #4 - "C Layer")
    # --------------------------------------------------------
    
    # Limit Request Zone (High Frequency CC)
    # zone=cc_limit:10m (store ~160k IPs) rate=50r/s (standard baseline)
    limit_req_zone $binary_remote_addr zone=cc_limit:10m rate=50r/s;

    # Limit Connection Zone (L7 concurrent connections)
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    
    # Shared Dictionaries for Lua (Metrics & Config)
    lua_shared_dict metrics_store 20m;
    lua_shared_dict config_store 10m;
    lua_shared_dict waf_cache 10m;
    lua_shared_dict ip_blacklist 10m;
    lua_shared_dict limit_req_store 20m;
    lua_shared_dict cc_req_rate 20m;
    lua_shared_dict guard_store 10m;
    
    # Init Worker: Metrics & Config
    init_worker_by_lua_block {
        local config_loader = require "lua.config_loader"
        config_loader.init() 
    }

    # Initialize ip2region with LRU Cache
    lua_shared_dict ip_data 20m;
    lua_shared_dict lru_cache_ip 20m;

    init_by_lua_block {
        local ok_ip2region, ip2region = pcall(require, "resty.ip2region.ip2region")
        local ok_lru, lrucache = pcall(require, "resty.lrucache")
        if not ok_ip2region or not ok_lru then
            ngx.log(ngx.WARN, "ip2region or lrucache module missing; skip IP geo init")
            return
        end

        -- Global IP Searcher
        _G.IP_SEARCHER = ip2region.new({
            file = "/www/server/go_project/openresty/cdn-system/agent/edge-node/data/ip2region.xdb", -- Path to be adjusted dynamically or fixed
            dict = "ip_data",
            mode = "memory"
        })

        -- Global LRU Cache for IP Results
        local c, err = lrucache.new(10000) -- capacity of 10000 entries
        if not c then
            return error("failed to create lrucache: " .. (err or "unknown"))
        end
        _G.IP_LRU_CACHE = c
    }
    include dynamic/http_global.conf;
    include dynamic/http.conf;
    log_by_lua_file lua/metrics_log.lua;

    server {
        listen 127.0.0.1:9100;
        server_name localhost;
        location /metrics {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block {
                local metrics = require "lua.metrics"
                ngx.say(metrics.get_prometheus_data())
            }
        }
    }
}

stream {
    limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
    include dynamic/stream_global.conf;
    include dynamic/stream.conf;
}
