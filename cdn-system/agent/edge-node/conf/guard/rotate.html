<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>安全验证</title>
<style>
body{ margin:0; padding:0;font-family: "Microsoft Yahei",Hiragino Sans GB, WenQuanYi Micro Hei, sans-serif; background:#f9f9f9}
.main{width:560px;margin:auto; margin-top:80px; padding: 0 15px; text-align:center}
@media screen and (max-width: 560px) {
.main {max-width:100%;}
}
.alert{ padding:15px; border:1px solid #d6e9c6; background:#dff0d8; color:#3c763d; border-radius:4px; }
.img-wrap{ margin:20px auto; background:#fff; border:1px solid #ddd; border-radius:6px; padding:12px; display:inline-block; }
#img{ max-width:320px; width:320px; height:auto; transform-origin:center center; }
.controls{ margin-top:10px; }
input[type=range]{ width:320px; max-width:100%; }
.btn{ display:inline-block; padding:6px 12px; font-size:14px; cursor:pointer; border:1px solid transparent; border-radius:4px; }
.btn-success{ color:#fff; background:#5cb85c; border-color:#4cae4c; }
.btn-default{ color:#333; background:#fff; border-color:#ccc; }
</style>
</head>
<body>
  <div class="main">
    <div class="alert">网站当前访问量较大，请旋转图片至正向后继续访问</div>
    <div class="img-wrap">
      <img id="img" src="/_guard/rotate_image" alt="rotate captcha" />
    </div>
    <div class="controls">
      <div>旋转角度：<span id="degText">0</span>°</div>
      <input id="deg" type="range" min="0" max="359" value="0" step="1" />
      <div style="margin-top:16px;">
        <button id="access" class="btn btn-success">进入网站</button>
        <button id="refresh" class="btn btn-default" style="margin-left:8px;">换一张</button>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="/_guard/encrypt.js"></script>
  <script type="text/javascript" src="/_guard/fingerprint.js"></script>
  <script type="text/javascript" src="/_guard/rotate_simple.js"></script>
</body>
</html>
