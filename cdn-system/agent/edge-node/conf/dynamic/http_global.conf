proxy_cache_path /data/nginx/cache/ levels=1:2 keys_zone=my_cache:1000M inactive=24h use_temp_path=off max_size=100g;
keepalive_timeout 62s;
keepalive_requests 100;
gzip_min_length 1k;
gzip_vary on;
server_tokens off;
default_type text/plain;
proxy_request_buffering on;
proxy_max_temp_file_size 1024m;
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
client_max_body_size 10m;
gzip_http_version 1.0;
proxy_http_version 1.0;
proxy_next_upstream error timeout;
proxy_read_timeout 60s;
large_client_header_buffers 4 32k;
gzip on;
gzip_comp_level 1;
log_not_found off;
proxy_buffering on;
proxy_cache_methods GET HEAD;
resolver 223.5.5.5 8.8.8.8;
resolver_timeout 5s;
access_log /usr/local/openresty/nginx/logs/access.json json_analytics;
