proxy_connect_timeout 60s;
proxy_timeout 10m;
log_format stream_json escape=json '{"time_iso8601":"$time_iso8601","remote_addr":"$remote_addr","protocol":"$protocol","status":$status,"bytes_sent":$bytes_sent,"bytes_received":$bytes_received,"session_time":"$session_time","upstream_addr":"$upstream_addr","upstream_bytes_sent":"$upstream_bytes_sent","upstream_bytes_received":"$upstream_bytes_received","upstream_connect_time":"$upstream_connect_time","upstream_session_time":"$upstream_session_time","server_port":$server_port}';
access_log /usr/local/openresty/nginx/logs/stream_access.json stream_json;
