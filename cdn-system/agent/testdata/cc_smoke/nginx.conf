worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    lua_package_path "/opt/cc/?.lua;/opt/cc/?/init.lua;/opt/cc/lua/?.lua;/opt/cc/lua/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_package_cpath "/opt/cc/lua/?.so;/usr/local/openresty/lualib/?.so;;";

    lua_shared_dict cc_req_rate 10m;
    lua_shared_dict guard_store 10m;
    lua_shared_dict waf_cache 10m;
    lua_shared_dict ip_blacklist 10m;
    lua_shared_dict metrics_store 10m;

    init_by_lua_block {
        local cjson = require "cjson.safe"
        local path = os.getenv("CC_TEST_CONFIG") or "/opt/cc/cdn_config.json"
        local f, err = io.open(path, "r")
        if not f then
            error("open config failed: " .. tostring(err))
        end
        local content = f:read("*a")
        f:close()
        local cfg, decode_err = cjson.decode(content)
        if not cfg then
            error("decode config failed: " .. tostring(decode_err))
        end
        _G.cdn_config = cfg
    }

    upstream origin_upstream {
        server host.docker.internal:18080;
    }

    server {
        listen 18088;
        server_name cc-test.local;

        set $cc_rule_id 10001;

        location / {
            access_by_lua_block {
                local domain_conf = nil
                local config = _G.cdn_config
                if config and config.domains then
                    for _, d in ipairs(config.domains) do
                        if d.name == ngx.var.host then
                            domain_conf = d
                            break
                        end
                    end
                end
                local cc = require "lua.cc"
                cc.check(domain_conf, ngx.var.remote_addr, ngx.var.uri)
            }

            proxy_pass http://origin_upstream;
        }
    }
}
